<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Lighthouse — A.L.I.C.E.</title>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    height:100%; font-family:'Inter','Helvetica Neue',Arial,sans-serif;
    background:#080F1A; color:#BDCEDC;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  @keyframes sweep   { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes breathe { 0%,100%{opacity:.7} 50%{opacity:1} }
  @keyframes rise    { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  .box {
    position:relative; z-index:1;
    text-align:center;
    animation:rise .8s ease;
    padding:24px;
  }

  .logo {
    color:#F5A623;
    font-size:13px; font-weight:700;
    letter-spacing:.18em; text-transform:uppercase;
    opacity:.8; margin-bottom:32px;
  }

  .welcome-headline {
    color:#F5A623;
    font-size:42px;
    font-weight:900;
    letter-spacing:.06em;
    line-height:1.1;
    text-align:center;
    margin-bottom:32px;
    text-shadow:0 0 40px rgba(245,166,35,.45), 0 0 80px rgba(245,166,35,.18);
    animation:breathe 4s ease-in-out infinite;
  }

  /* Orb */
  .orb-wrap {
    position:relative; width:200px; height:200px;
    margin:0 auto 28px;
    display:flex; align-items:center; justify-content:center;
  }
  /* Beam inside orb — centered on same axis */
  .orb-beam-glow {
    position:absolute; width:100%; height:100%; border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0deg, rgba(245,166,35,.22) 22deg, transparent 48deg);
    animation:sweep 7s linear infinite; filter:blur(8px);
  }
  .orb-beam {
    position:absolute; width:100%; height:100%; border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0deg, rgba(245,166,35,.52) 8deg, rgba(245,166,35,.92) 14deg, rgba(245,166,35,.52) 22deg, transparent 34deg);
    animation:sweep 7s linear infinite;
  }
  .orb-ring {
    position:absolute; border-radius:50%;
    animation:breathe 3.5s ease-in-out infinite;
  }
  .or3 { width:100%; height:100%; background:radial-gradient(circle, rgba(245,166,35,.08) 0%, transparent 70%); animation-delay:0s; }
  .or2 { width:72%; height:72%; background:radial-gradient(circle, rgba(245,166,35,.14) 0%, transparent 70%); animation-delay:.4s; }
  .or1 { width:50%; height:50%; background:radial-gradient(circle, rgba(245,166,35,.22) 0%, transparent 70%); animation-delay:.8s; }
  .orb-core {
    width:54px; height:54px; border-radius:50%; z-index:2; position:relative;
    background:radial-gradient(circle at 38% 38%, #F5A623EE, #F5A62888);
    box-shadow:0 0 28px rgba(245,166,35,.55), 0 0 60px rgba(245,166,35,.2);
    animation:breathe 4s ease-in-out infinite;
  }
  .orb-core::after {
    content:''; position:absolute; top:16%; left:20%;
    width:32%; height:22%; border-radius:50%;
    background:rgba(255,255,255,.25); transform:rotate(-32deg);
  }

  /* Name */
  .alice {
    color:#F5A623; font-size:28px; font-weight:900;
    letter-spacing:.18em; margin-bottom:8px;
    text-shadow:0 0 28px rgba(245,166,35,.45);
    animation:breathe 4s ease-in-out infinite;
  }
  .tagline {
    color:#6A9AB8; font-size:13px; line-height:1.7;
    margin-bottom:40px; max-width:320px;
  }

  /* Button */
  .launch-btn {
    background:linear-gradient(135deg, #F5A623, #FFD700);
    color:#080F1A; border:none; border-radius:12px;
    padding:16px 52px; font-size:16px; font-weight:900;
    letter-spacing:.04em; cursor:pointer; font-family:inherit;
    box-shadow:0 4px 32px rgba(245,166,35,.48);
    transition:transform .15s, box-shadow .15s;
    display:block; margin:0 auto 16px;
  }
  .launch-btn:hover {
    transform:translateY(-2px);
    box-shadow:0 8px 40px rgba(245,166,35,.58);
  }
  .launch-btn:active { transform:translateY(0); }

  .note { color:#1E3D58; font-size:11px; letter-spacing:.04em; }

  /* After launch */
  .launched { display:none; }
  .launched p { color:#6A9AB8; font-size:13px; line-height:1.7; }
  .reopen { background:none; border:1px solid #1E3D58; color:#6A9AB8; border-radius:8px; padding:8px 20px; font-size:12px; cursor:pointer; font-family:inherit; margin-top:16px; transition:all .2s; }
  .reopen:hover { border-color:#6A9AB8; color:#BDCEDC; }
</style>
</head>
<body>

<div class="box">
  <div class="logo">⬡ Project Lighthouse</div>

  <div class="welcome-headline">WELCOME TO<br/>LIGHTHOUSE</div>

  <div class="orb-wrap">
    <div class="orb-beam-glow"></div>
    <div class="orb-beam"></div>
    <div class="orb-ring or3"></div>
    <div class="orb-ring or2"></div>
    <div class="orb-ring or1"></div>
    <div class="orb-core"></div>
  </div>

  <div class="alice">A.L.I.C.E.</div>
  <p class="tagline">
    A genuine discovery conversation —<br/>
    no scoring, no ranking, no labels.<br/>
    Your profile belongs to you.
  </p>

  <div id="pre-launch">
    <button class="launch-btn" onclick="launch()">Begin Discovery →</button>
    <div class="note">Opens in its own window</div>
  </div>

  <div class="launched" id="post-launch">
    <p>Alice is open in her own window.<br/>You can close this page.</p>
    <button class="reopen" onclick="launch()">Reopen if closed →</button>
  </div>
</div>

<script>
let aliceWindow = null;

function launch() {
  const w = 500, h = 880;
  const left = Math.round((screen.width  - w) / 2);
  const top  = Math.round((screen.height - h) / 2);

  if (aliceWindow && !aliceWindow.closed) {
    aliceWindow.focus();
    return;
  }

  aliceWindow = window.open(
    'alice.html',
    'alice_discovery',
    `width=${w},height=${h},top=${top},left=${left},menubar=no,toolbar=no,location=no,status=no,scrollbars=no,resizable=yes`
  );

  if (aliceWindow) {
    aliceWindow.focus();
    document.getElementById('pre-launch').style.display = 'none';
    document.getElementById('post-launch').style.display = 'block';
  }
}
</script>
</body>
</html>
